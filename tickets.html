<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destek Taleplerim | AI Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0b14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .bg-glow-top {
            position: fixed; top: -150px; left: 50%; transform: translateX(-50%);
            width: 700px; height: 400px;
            background: radial-gradient(ellipse, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .back-btn {
            position: fixed; top: 25px; left: 35px;
            color: #38bdf8; text-decoration: none; font-weight: 600;
            font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
            background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 8px 16px; border-radius: 12px;
            backdrop-filter: blur(10px); transition: all 0.2s ease;
            z-index: 10;
        }
        .back-btn:hover { background: rgba(56, 189, 248, 0.18); transform: translateX(-2px); }

        .tickets-card {
            width: 100%; max-width: 740px;
            background: rgba(16, 19, 32, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px;
            backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative; z-index: 1;
        }

        .tickets-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap; gap: 10px;
        }
        .tickets-title {
            font-size: 1.4rem; font-weight: 800; color: #38bdf8;
            display: flex; align-items: center; gap: 10px;
        }

        .filter-tabs {
            display: flex; gap: 8px; margin-bottom: 20px;
        }
        .filter-tab-btn {
            background: rgba(255, 255, 255, 0.03); color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 7px 16px; border-radius: 20px;
            font-size: 0.83rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-tab-btn.active {
            background: rgba(56, 189, 248, 0.15); color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.4);
        }

        .tickets-list {
            display: flex; flex-direction: column; gap: 14px;
            max-height: 520px; overflow-y: auto; padding-right: 4px;
        }
        .ticket-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px; padding: 20px;
            transition: all 0.2s ease; position: relative;
        }
        .ticket-item:hover {
            border-color: rgba(56, 189, 248, 0.25);
            background: rgba(255, 255, 255, 0.03);
        }
        .ticket-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; flex-wrap: wrap; gap: 6px;
        }
        .ticket-id {
            font-size: 0.8rem; font-family: monospace; font-weight: 700; color: #38bdf8;
            background: rgba(56, 189, 248, 0.1); padding: 3px 8px; border-radius: 6px;
        }
        .ticket-subject {
            font-size: 1.05rem; font-weight: 800; color: #ffffff; margin-bottom: 6px;
        }
        .ticket-date {
            font-size: 0.75rem; color: #64748b; font-weight: 600;
        }
        .ticket-message {
            font-size: 0.88rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 10px;
        }
        .admin-reply-box {
            background: rgba(34, 197, 94, 0.08);
            border-left: 3px solid #22c55e;
            padding: 12px 14px; border-radius: 0 10px 10px 0;
            font-size: 0.86rem; color: #dcfce7; margin-top: 10px;
        }
        .admin-reply-header {
            font-size: 0.75rem; font-weight: 700; color: #4ade80; margin-bottom: 4px;
            display: flex; align-items: center; gap: 6px;
        }

        .btn-new-ticket {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a; text-decoration: none; font-weight: 700;
            border-radius: 12px; padding: 10px 18px; font-size: 0.88rem;
            display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease;
        }
        .btn-new-ticket:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }

        .btn-delete-sm {
            background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444; font-weight: 600; border-radius: 8px;
            padding: 5px 10px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-delete-sm:hover { background: rgba(239, 68, 68, 0.18); }

        .empty-state {
            text-align: center; padding: 50px 20px; color: #64748b;
        }
        .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="bg-glow-top"></div>
    <a href="index.html" class="back-btn">← Ana Sayfaya Dön</a>

    <div class="tickets-card">
        <div class="tickets-header">
            <div class="tickets-title">
                <span>🎫 Destek Taleplerim & Takip</span>
            </div>
            <a href="iletisim.html" class="btn-new-ticket">➕ Yeni Talep Oluştur</a>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab-btn active" onclick="setFilter('all', this)">Tüm Taleplerim</button>
            <button class="filter-tab-btn" onclick="setFilter('open', this)">⏳ Açık / İnceleniyor</button>
            <button class="filter-tab-btn" onclick="setFilter('solved', this)">✓ Çözüldü / Yanıtlandı</button>
        </div>

        <div id="tickets-list-container" class="tickets-list">
            <!-- JS dinamik render -->
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let currentFilter = 'all';

        function loadUserTicketsPage() {
            const user = JSON.parse(localStorage.getItem('user'));
            const container = document.getElementById('tickets-list-container');
            if (!container) return;

            if (!user) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔒</div>
                        <h3>Giriş Yapmanız Gerekiyor</h3>
                        <p style="margin-top:6px; font-size:0.88rem;">Destek taleplerinizi takip etmek için lütfen hesabınıza giriş yapın.</p>
                        <br>
                        <a href="login.html" class="btn-new-ticket">🔑 Giriş Yap</a>
                    </div>
                `;
                return;
            }

            const allTickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
            const userTickets = allTickets.filter(t => t.username === user.username);

            let filtered = userTickets;
            if (currentFilter === 'open') filtered = userTickets.filter(t => t.status !== 'Çözüldü');
            if (currentFilter === 'solved') filtered = userTickets.filter(t => t.status === 'Çözüldü');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎫</div>
                        <h3>Destek Talebi Bulunamadı</h3>
                        <p style="margin-top:6px; font-size:0.88rem; color:#94a3b8;">Henüz oluşturulmuş bir destek talebiniz bulunmuyor.</p>
                        <br>
                        <a href="iletisim.html" class="btn-new-ticket">💬 Yeni Destek Talebi Oluştur</a>
                    </div>
                `;
                return;
            }

            // Gelen kutusu bildirimleri arasından yanıtları bul
            const notifs = JSON.parse(localStorage.getItem('userNotifications') || '[]');

            container.innerHTML = filtered.map(t => {
                const priorityBg = t.priority === 'Acil' ? 'rgba(239,68,68,0.15)' : 'rgba(56,189,248,0.1)';
                const priorityColor = t.priority === 'Acil' ? '#f87171' : '#38bdf8';

                const isSolved = t.status === 'Çözüldü';
                const statusBg = isSolved ? 'rgba(34,197,94,0.15)' : 'rgba(251,191,36,0.15)';
                const statusColor = isSolved ? '#4ade80' : '#fbbf24';

                // Bu talebe ait admin yanıt bildirimi var mı?
                const replyNotif = notifs.find(n => n.targetUser === user.username && n.title && n.title.includes(`#${t.id}`));

                return `
                    <div class="ticket-item">
                        <div class="ticket-top">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="ticket-id">#${t.id}</span>
                                <span style="background:${priorityBg}; color:${priorityColor}; padding:2px 8px; border-radius:10px; font-size:0.72rem; font-weight:700;">${t.priority || 'Normal'}</span>
                                <span style="background:${statusBg}; color:${statusColor}; padding:2px 8px; border-radius:10px; font-size:0.72rem; font-weight:700;">${t.status}</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span class="ticket-date">🕒 ${t.date}</span>
                                <button onclick="deleteUserTicket('${t.id}')" class="btn-delete-sm">Sil</button>
                            </div>
                        </div>
                        <div class="ticket-subject">💬 ${t.subject}</div>
                        <div class="ticket-message">${t.message}</div>

                        ${isSolved ? `
                            <div class="admin-reply-box">
                                <div class="admin-reply-header">🛡️ YÖNETİCİ YANITI (Çözüldü)</div>
                                ${replyNotif && replyNotif.adminNote ? replyNotif.adminNote : 'Talebiniz incelenmiş ve gerekli işlem sağlanmıştır.'}
                            </div>
                        ` : `
                            <div style="font-size:0.78rem; color:#fbbf24; font-weight:600; margin-top:6px;">
                                ⏳ Talebiniz yönetim ekibimiz tarafından incelenmektedir. Yanıtlandığında Gelen Kutunuza bildirim düşecektir.
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        function setFilter(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadUserTicketsPage();
        }

        function deleteUserTicket(id) {
            if (!confirm(`#${id} numaralı destek talebini listeden kaldırmak istediğinize emin misiniz?`)) return;
            let tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
            tickets = tickets.filter(t => String(t.id) !== String(id));
            localStorage.setItem('supportTickets', JSON.stringify(tickets));
            loadUserTicketsPage();
        }

        document.addEventListener('DOMContentLoaded', loadUserTicketsPage);
    </script>
</body>
</html>

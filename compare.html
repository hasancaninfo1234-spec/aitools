<!-- Bu dosya, yapay zeka araçlarını karşılaştırma ekranını oluşturma işini yapar. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Karşılaştırma | AI Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .compare-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 40px;
            background: #161926;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(56, 189, 248, 0.15);
        }
        .selector-row {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
            align-items: center;
        }
        .tool-select {
            padding: 15px 25px;
            background: #1e2235;
            border: 2px solid rgba(56, 189, 248, 0.3);
            color: white;
            border-radius: 12px;
            font-size: 1.1rem;
            width: 350px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .tool-select:hover, .tool-select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .tool-select option {
            background: #1e2235;
            color: white;
            padding: 10px;
        }
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 20px;
            display: none; 
        }
        .tool-card {
            background: #1e2235;
            border-radius: 14px;
            padding: 35px;
            border: 1px solid rgba(56, 189, 248, 0.1);
            transition: transform 0.3s ease, opacity 0.4s ease;
        }
        .tool-title {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .tool-category {
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            display: block;
        }
        .specs-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
            color: #e2e8f0;
        }
        .specs-list li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
            padding-left: 30px;
            line-height: 1.5;
        }
        .specs-list li:last-child {
            border-bottom: none;
        }
        .specs-list li::before {
            content: '✓';
            color: #38bdf8;
            position: absolute;
            left: 0;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .tool-desc {
            color: #94a3b8;
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 1.05rem;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 80px 20px;
            font-size: 1.3rem;
            grid-column: 1 / -1;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px dashed rgba(255,255,255,0.1);
        }
    </style>
</head>
<body style="background:#0a0b14; color:white; min-height: 100vh; display: flex; flex-direction: column;">
    
    <div style="padding: 30px 50px;">
        <a href="index.html" style="color:#38bdf8; text-decoration:none; font-weight:bold; font-size: 1.1rem; transition: color 0.3s; display: inline-flex; align-items: center; gap: 8px;">
            <span style="font-size: 1.6rem;">←</span> Merkeze Dön
        </a>
    </div>

    <div class="compare-container" style="flex: 1; display:flex; flex-direction:column; align-items: stretch;">
        <h1 style="text-align: center; margin-bottom: 40px; font-size: 2.8rem; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Araç Karşılaştırma Laboratuvarı</h1>
        
        <div class="selector-row">
            <select id="tool1-select" class="tool-select">
                <option value="">1. Aracı Seçin</option>
            </select>
            <div style="width: 50px; height: 50px; background: rgba(56, 189, 248, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #38bdf8; font-weight: bold; border: 1px solid rgba(56, 189, 248, 0.3);">
                VS
            </div>
            <select id="tool2-select" class="tool-select">
                <option value="">2. Aracı Seçin</option>
            </select>
        </div>

        <div id="empty-state" class="empty-state">
            Lütfen karşılaştırmak istediğiniz iki yapay zeka aracını yukarıdan seçin.
        </div>

        <div id="comparison-grid" class="comparison-grid">
            <div id="tool1-render" class="tool-card" style="opacity: 0;"></div>
            <div id="tool2-render" class="tool-card" style="opacity: 0;"></div>
        </div>
    </div>

    <script>
        let tools = [];

        async function init() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if(!user) {
                    alert("Yetkisiz erişim! Lütfen giriş yapın.");
                    window.location.href = 'index.html';
                    return;
                }

                // Sunum için geçici olarak Premium kontrolü kaldırıldı
                // const authRes = await fetch(`http://localhost:3000/api/verify-premium/${user.id}`);
                // const authData = await authRes.json();
                
                // if(authData.status !== "premium") {
                //     alert("✨ Karşılaştırma Laboratuvarı sadece Premium üyelere özeldir!");
                //     window.location.href = 'index.html';
                //     return;
                // }

                let res = await fetch('/api/tools').catch(() => null);
                if (!res || !res.ok) res = await fetch('http://localhost:3000/api/tools').catch(() => null);
                if (!res || !res.ok) res = await fetch('tools.json').catch(() => null);
                if (res && res.ok) {
                    tools = await res.json();
                }
                
                // İsimlere göre A-Z sıralama
                tools.sort((a,b) => a.name.localeCompare(b.name));

                populateSelects();
                
                document.getElementById('tool1-select').addEventListener('change', updateComparison);
                document.getElementById('tool2-select').addEventListener('change', updateComparison);

            } catch(e) {
                console.error("Araçlar yüklenemedi:", e);
                document.getElementById('empty-state').innerHTML = "<span style='color:#ef4444;'>Araçlar yüklenirken bir hata oluştu!</span> sunucunun çalıştığından emin olun.";
            }
        }

        function populateSelects() {
            const select1 = document.getElementById('tool1-select');
            const select2 = document.getElementById('tool2-select');
            
            tools.forEach(tool => {
                const option1 = document.createElement('option');
                option1.value = tool.id;
                option1.textContent = tool.name;
                select1.appendChild(option1);

                const option2 = document.createElement('option');
                option2.value = tool.id;
                option2.textContent = tool.name;
                select2.appendChild(option2);
            });
        }

        function renderToolCard(tool) {
            const specsHtml = tool.specs && tool.specs.length > 0 
                ? tool.specs.map(s => `<li>${s}</li>`).join('') 
                : "<li>Özellik belirtilmemiş</li>";

            const urlBtn = tool.url ? `<a href="${tool.url}" target="_blank" style="display:inline-block; margin-top:20px; background:linear-gradient(45deg, #38bdf8, #818cf8); color:#000; text-decoration:none; padding:12px 24px; border-radius:12px; font-weight:800; transition:0.3s; box-shadow: 0 4px 15px rgba(56,189,248,0.3);" onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 6px 20px rgba(56,189,248,0.5)';" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 15px rgba(56,189,248,0.3)';">Siteye Git ↗</a>` : '';

            return `
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <span style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border: 1px solid rgba(56,189,248,0.3); display:inline-block; margin-bottom:15px; box-shadow: 0 0 10px rgba(56,189,248,0.2);">${tool.category}</span>
                        <h2 class="tool-title" style="margin-bottom:5px; text-shadow: 0 2px 10px rgba(56,189,248,0.2);">${tool.name}</h2>
                    </div>
                </div>
                
                <div style="margin: 30px 0; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <h3 style="color:white; margin-bottom:20px; font-size:1.1rem; display: flex; align-items: center; gap:10px;">
                        <span style="color:#f59e0b; font-size: 1.3rem;">⚡</span> Öne Çıkan Özellikler
                    </h3>
                    <ul class="specs-list">
                        ${specsHtml}
                    </ul>
                </div>
                
                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05);">
                    <h3 style="color:#e2e8f0; margin-bottom:15px; font-size:1.1rem; display:flex; align-items:center; gap:8px;">
                        <span style="color:#818cf8;">📝</span> Model Detayları
                    </h3>
                    <div class="tool-desc">${tool.longDescription || tool.description}</div>
                </div>
                
                <div style="text-align: right; margin-top: 15px;">
                    ${urlBtn}
                </div>
            `;
        }

        function updateComparison() {
            const id1 = document.getElementById('tool1-select').value;
            const id2 = document.getElementById('tool2-select').value;
            
            const grid = document.getElementById('comparison-grid');
            const emptyState = document.getElementById('empty-state');
            const card1 = document.getElementById('tool1-render');
            const card2 = document.getElementById('tool2-render');

            if (id1 || id2) {
                emptyState.style.display = 'none';
                grid.style.display = 'grid';
                
                if (id1) {
                    const tool1 = tools.find(t => t.id == id1);
                    card1.innerHTML = renderToolCard(tool1);
                    card1.style.opacity = '1';
                } else {
                    card1.style.opacity = '0';
                }

                if (id2) {
                    const tool2 = tools.find(t => t.id == id2);
                    card2.innerHTML = renderToolCard(tool2);
                    card2.style.opacity = '1';
                } else {
                    card2.style.opacity = '0';
                }
            } else {
                emptyState.style.display = 'block';
                grid.style.display = 'none';
            }
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Detaylar | AI Universe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#0a0b14; color:white; padding:40px;">
    <a href="index.html" style="color:#38bdf8; text-decoration:none; font-weight:bold;">← Rehbere Dön</a>
    
    <div id="content" style="max-width:1200px; margin:40px auto;">
        <span id="det-cat" style="color:#38bdf8; font-weight:bold; letter-spacing:2px;">KATEGORİ</span>
        <h1 id="det-name" style="font-size:3.5rem; margin:10px 0;">Yükleniyor...</h1>
        
        <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:30px; margin-top:40px;">
            <div class="card" style="padding:30px; background:#161926;">
                <h3 style="color:#38bdf8; margin-bottom:20px;">Teknik Özellikler</h3>
                <ul id="det-specs" style="line-height:2.2; color:#94a3b8; padding-left:20px;"></ul>
            </div>
            
            <div class="card" style="padding:30px; background:#161926;">
                <h3 style="color:#38bdf8; margin-bottom:20px;">Model Hakkında</h3>
                <p id="det-long-desc" style="color:#94a3b8; line-height:1.8; font-size:1.1rem;"></p>
                <br><br>
                <a id="det-url" href="#" target="_blank" style="display:inline-block; padding:12px 25px; background:#38bdf8; color:black; border-radius:8px; text-decoration:none; font-weight:bold;">Resmi Web Sitesine Git</a>
            </div>
        </div>
    </div>

    <script>
        async function load() {
            const id = new URLSearchParams(window.location.search).get('id');
            const res = await fetch('http://localhost:3000/api/tools');
            const tool = (await res.json()).find(t => t.id == id);

            if(tool) {
                document.getElementById('det-name').innerText = tool.name;
                document.getElementById('det-cat').innerText = tool.category.toUpperCase();
                document.getElementById('det-long-desc').innerText = tool.longDescription || "Bu model hakkında henüz detaylı bilgi eklenmemiş.";
                document.getElementById('det-url').href = tool.url || "#";
                document.getElementById('det-url').style.display = tool.url ? 'inline-block' : 'none';
                
                const specs = document.getElementById('det-specs');
                specs.innerHTML = tool.specs && tool.specs.length > 0 
                    ? tool.specs.map(s => `<li>${s}</li>`).join('') 
                    : "Teknik özellik belirtilmemiş.";
            }
        }
        load();
    </script>
</body>
</html>

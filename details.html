<!-- Bu dosya, bir aracın detaylı bilgilerini gösterme işini yapar. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Detaylar | AI Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#0a0b14; color:white; padding:40px;">
    <a href="index.html" style="color:#38bdf8; text-decoration:none; font-weight:bold;">← Rehbere Dön</a>
    
    <div id="content" style="max-width:1200px; margin:40px auto;">
        <span id="det-cat" style="color:#38bdf8; font-weight:bold; letter-spacing:2px;">KATEGORİ</span>
        <h1 id="det-name" style="font-size:3.5rem; margin:10px 0;">Yükleniyor...</h1>
        
        <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:30px; margin-top:40px;">
            <div class="card" style="padding:30px; background:#161926;">
                <h3 style="color:#38bdf8; margin-bottom:20px;">Teknik Özellikler</h3>
                <ul id="det-specs" style="line-height:2.2; color:#94a3b8; padding-left:20px;"></ul>
            </div>
            
            <div class="card" style="padding:30px; background:#161926;">
                <h3 style="color:#38bdf8; margin-bottom:20px;">Model Hakkında</h3>
                <p id="det-long-desc" style="color:#94a3b8; line-height:1.8; font-size:1.1rem; white-space: pre-wrap;"></p>
                <br><br>
                <a id="det-url" href="#" target="_blank" style="display:inline-block; padding:12px 25px; background:#38bdf8; color:black; border-radius:8px; text-decoration:none; font-weight:bold;">Resmi Web Sitesine Git</a>
            </div>
        </div>

        <!-- Yorumlar ve Değerlendirmeler -->
        <div class="card" style="margin-top: 40px; padding: 30px; background: #161926;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px;">
                <h3 style="color: #38bdf8; margin: 0;">Topluluk Değerlendirmeleri</h3>
                <div id="det-avg-rating" style="color: #fbbf24; font-size: 1.2rem; font-weight: bold;">☆</div>
            </div>
            
            <div id="reviews-container" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px;">
                <!-- Yorumlar buraya gelecek -->
            </div>

            <div id="review-form-container" style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                <h4 style="margin: 0 0 15px 0; color: #fff;">Değerlendirme Ekle</h4>
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <div>
                        <label style="color:#94a3b8; font-size:0.9rem; margin-right: 10px;">Puanınız:</label>
                        <select id="review-rating" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 5px;">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                    </div>
                    <textarea id="review-text" rows="3" placeholder="Bu araç hakkındaki deneyiminizi paylaşın..." style="width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 10px; font-family: inherit; resize: vertical;"></textarea>
                    <button onclick="submitReview()" style="align-self: flex-start; background: #38bdf8; color: #0a0b14; border: none; border-radius: 6px; padding: 10px 20px; font-weight: bold; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#0ea5e9'" onmouseout="this.style.background='#38bdf8'">Gönder</button>
                </div>
            </div>
            <div id="review-auth-warning" style="display: none; color: #ef4444; font-size: 0.9rem; padding: 15px; background: rgba(239, 68, 68, 0.1); border-radius: 8px;">Değerlendirme yapabilmek için lütfen ana sayfa üzerinden giriş yapın.</div>
        </div>
    </div>

    <script>
        let currentTool = null;
        let currentUser = null;

        async function load() {
            currentUser = JSON.parse(localStorage.getItem('user')) || null;
            if(!currentUser) {
                document.getElementById('review-form-container').style.display = 'none';
                document.getElementById('review-auth-warning').style.display = 'block';
            }

            const id = new URLSearchParams(window.location.search).get('id');
            const res = await fetch('http://localhost:3000/api/tools');
            const tools = await res.json();
            currentTool = tools.find(t => t.id == id);

            if(currentTool) {
                document.getElementById('det-name').innerText = currentTool.name;
                document.getElementById('det-cat').innerText = currentTool.category.toUpperCase();
                document.getElementById('det-long-desc').innerText = currentTool.longDescription || "Bu model hakkında henüz detaylı bilgi eklenmemiş.";
                document.getElementById('det-url').href = currentTool.url || "#";
                document.getElementById('det-url').style.display = currentTool.url ? 'inline-block' : 'none';
                
                const specs = document.getElementById('det-specs');
                specs.innerHTML = currentTool.specs && currentTool.specs.length > 0 
                    ? currentTool.specs.map(s => `<li>${s}</li>`).join('') 
                    : "Teknik özellik belirtilmemiş.";

                renderReviews();
            }
        }

        function renderReviews() {
            const container = document.getElementById('reviews-container');
            const avgDiv = document.getElementById('det-avg-rating');
            
            if (!currentTool.reviews || currentTool.reviews.length === 0) {
                container.innerHTML = '<div style="color: #64748b; font-style: italic;">Henüz değerlendirme yapılmamış. İlk değerlendiren siz olun!</div>';
                avgDiv.innerText = '☆ Henüz Puanlanmadı';
                return;
            }

            let sum = 0;
            const html = currentTool.reviews.map(r => {
                sum += parseInt(r.rating);
                const stars = '⭐'.repeat(parseInt(r.rating)) + '☆'.repeat(5 - parseInt(r.rating));
                const dateSplit = new Date(r.date || Date.now()).toLocaleDateString('tr-TR');
                return `
                <div style="background: rgba(255,255,255,0.03); border-radius: 8px; padding: 15px; border-left: 3px solid #38bdf8;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <div>
                            <span style="color: #fff; font-weight: bold; margin-right: 10px;">${r.username}</span>
                            <span style="color: #fbbf24; letter-spacing: 2px;">${stars}</span>
                        </div>
                        <span style="color: #64748b; font-size: 0.8rem;">${dateSplit}</span>
                    </div>
                    <div style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap;">${r.reviewText || ''}</div>
                </div>
                `;
            }).reverse().join('');
            
            container.innerHTML = html;
            const avg = (sum / currentTool.reviews.length).toFixed(1);
            avgDiv.innerText = '⭐ ' + avg + ' (' + currentTool.reviews.length + ' Değerlendirme)';
        }

        async function submitReview() {
            if (!currentUser) return;
            const rating = document.getElementById('review-rating').value;
            const text = document.getElementById('review-text').value.trim();
            
            if(!text) {
                alert("Lütfen bir değerlendirme metni yazın.");
                return;
            }

            const sysReviews = currentTool.reviews || [];
            
            const existingIdx = sysReviews.findIndex(r => r.userId === currentUser.id);
            const newReview = {
                id: Date.now().toString(),
                userId: currentUser.id,
                username: currentUser.username,
                rating: parseInt(rating),
                reviewText: text,
                date: Date.now()
            };

            if (existingIdx > -1) {
                if(!confirm("Zaten bir değerlendirmeniz var. Üzerine yazılmasını onaylıyor musunuz?")) return;
                sysReviews[existingIdx] = newReview;
            } else {
                sysReviews.push(newReview);
            }

            try {
                const res = await fetch(`http://localhost:3000/api/tools/${currentTool.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reviews: sysReviews })
                });

                if (res.ok) {
                    currentTool.reviews = sysReviews;
                    document.getElementById('review-text').value = '';
                    renderReviews();
                    alert("Değerlendirmeniz başarıyla kaydedildi!");
                } else {
                    alert("Kaydedilirken bir hata oluştu.");
                }
            } catch (e) {
                alert("Sunucuya bağlanılamadı.");
            }
        }

        load();
    </script>
</body>
</html>

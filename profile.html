<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim | AI Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0b14;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ARKA PLAN EFEKTİ --- */
        .bg-glow {
            position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
            width: 800px; height: 500px;
            background: radial-gradient(ellipse, rgba(56,189,248,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        /* --- BACK BUTTON --- */
        .back-btn {
            position: fixed; top: 25px; left: 30px;
            color: #38bdf8; text-decoration: none; font-weight: 600;
            font-size: 0.9rem; display: flex; align-items: center; gap: 6px;
            opacity: 0.8; transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 1; }

        /* --- ANA KART --- */
        .profile-card {
            width: 100%; max-width: 480px;
            background: rgba(16, 18, 30, 0.9);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 35px 30px;
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 1;
        }

        /* --- AVATAR & BAŞLIK --- */
        .profile-header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 22px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .avatar-circle {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 14px auto;
            box-shadow: 0 0 25px rgba(56,189,248,0.25);
        }
        .profile-name {
            font-size: 1.3rem; font-weight: 700; color: #fff;
            margin-bottom: 4px;
        }
        .profile-badge {
            display: inline-block; font-size: 0.75rem; font-weight: 600;
            padding: 3px 10px; border-radius: 20px;
            background: rgba(148,163,184,0.1); color: #94a3b8;
            border: 1px solid rgba(148,163,184,0.15);
        }
        .profile-badge.premium {
            background: rgba(245,158,11,0.12);
            color: #f59e0b;
            border-color: rgba(245,158,11,0.25);
        }

        /* --- BÖLÜMLER --- */
        .section {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 0.8rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            color: #64748b; margin-bottom: 14px;
        }

        /* --- KEY INPUT --- */
        .key-row {
            display: flex; gap: 8px;
        }
        .key-input-field {
            flex: 1; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; padding: 9px 14px;
            color: #fff; font-size: 0.9rem; outline: none;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .key-input-field:focus { border-color: #38bdf8; }
        .key-input-field::placeholder { color: #475569; }
        .btn-primary {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            color: #000; font-weight: 700;
            border: none; border-radius: 8px;
            padding: 9px 16px; cursor: pointer;
            font-size: 0.85rem; white-space: nowrap;
            transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.85; }
        .key-msg { font-size: 0.8rem; margin-top: 8px; display: none; }

        /* --- ŞİFRE FORMU --- */
        .pass-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; padding: 9px 14px;
            color: #fff; font-size: 0.9rem; outline: none;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .pass-input:focus { border-color: #38bdf8; }
        .pass-input::placeholder { color: #475569; }
        .btn-outline {
            width: 100%; margin-top: 10px;
            background: transparent;
            border: 1px solid rgba(56,189,248,0.3);
            color: #38bdf8; font-weight: 600;
            border-radius: 8px; padding: 9px;
            cursor: pointer; font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-outline:hover { background: rgba(56,189,248,0.08); border-color: #38bdf8; }
        .pass-msg { font-size: 0.8rem; margin-top: 8px; color: #4ade80; display: none; }

        /* --- ÇIKIŞ --- */
        .btn-logout {
            width: 100%; background: rgba(239,68,68,0.05);
            border: 1px solid rgba(239,68,68,0.2);
            color: #ef4444; font-weight: 600;
            border-radius: 10px; padding: 11px;
            cursor: pointer; font-size: 0.9rem;
            transition: all 0.2s; margin-top: 4px;
        }
        .btn-logout:hover { background: rgba(239,68,68,0.12); }

        /* --- GİRİŞ FORMU (Login/Register) --- */
        .auth-card {
            width: 100%; max-width: 400px;
            background: rgba(16, 18, 30, 0.9);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px; padding: 35px 28px;
            backdrop-filter: blur(20px);
            position: relative; z-index: 1;
        }
        .auth-card h2 {
            font-size: 1.4rem; font-weight: 800;
            color: #38bdf8; text-align: center; margin-bottom: 6px;
        }
        .auth-subtitle {
            text-align: center; color: #64748b;
            font-size: 0.85rem; margin-bottom: 24px;
        }
        .auth-label { font-size: 0.78rem; color: #64748b; font-weight: 600; margin-bottom: 5px; display: block; }
        .auth-field {
            width: 100%; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; padding: 10px 14px;
            color: #fff; font-size: 0.9rem; outline: none;
            transition: border-color 0.2s; margin-bottom: 14px;
            font-family: 'Inter', sans-serif;
        }
        .auth-field:focus { border-color: #38bdf8; }
        .auth-field::placeholder { color: #475569; }
        .btn-login {
            width: 100%; margin-top: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            color: #000; font-weight: 800;
            border: none; border-radius: 10px;
            padding: 12px; cursor: pointer;
            font-size: 1rem; letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.85; }
        .toggle-link {
            text-align: center; margin-top: 18px;
            font-size: 0.83rem; color: #64748b;
        }
        .toggle-link a { color: #38bdf8; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <a href="index.html" class="back-btn">← Ana Sayfaya Dön</a>

    <!-- GİRİŞ YAPILMIŞSA -->
    <div class="profile-card" id="profile-container" style="display:none;">
        <div class="profile-header">
            <div class="avatar-circle" id="avatar-emoji">👤</div>
            <div class="profile-name" id="prof-name">Kullanıcı</div>
            <span class="profile-badge" id="prof-badge">Normal Üye</span>
        </div>

        <!-- Premium / Key -->
        <div class="section" id="key-section">
            <div class="section-title">👑 Premium Üyelik</div>
            <div class="key-row">
                <input type="text" id="premium-key" class="key-input-field" placeholder="Premium key kodunu gir...">
                <button onclick="keyAktifEtProfil()" class="btn-primary">Aktif Et</button>
            </div>
            <div id="key-msg" class="key-msg"></div>
        </div>

        <!-- Şifre -->
        <div class="section">
            <div class="section-title">🔒 Şifre Güncelle</div>
            <form id="profile-pass-form">
                <input type="password" id="prof-new-password" class="pass-input" placeholder="Yeni şifreniz...">
                <button type="submit" class="btn-outline">Şifremi Güncelle</button>
            </form>
            <div id="prof-pass-msg" class="pass-msg"></div>
        </div>

        <button onclick="cikisYapProfil()" class="btn-logout">Çıkış Yap</button>
    </div>

    <!-- GİRİŞ YAPILMAMIŞSA -->
    <div class="auth-card" id="login-container" style="display:none;">
        <h2 id="auth-title">Giriş Yap</h2>
        <p class="auth-subtitle">Profilinize erişmek için giriş yapın.</p>

        <form id="auth-form-profil">
            <label class="auth-label">Kullanıcı Adı</label>
            <input type="text" id="auth-user-profil" class="auth-field" placeholder="Kullanıcı adınız..." autocomplete="off" required>

            <div id="auth-pass-group-profil">
                <label class="auth-label">Şifre</label>
                <input type="password" id="auth-pass-profil" class="auth-field" placeholder="Şifreniz...">
            </div>

            <button type="submit" class="btn-login" id="auth-submit-profil">GİRİŞ YAP</button>
        </form>

        <div class="toggle-link">
            <a href="#" onclick="toggleAuthProfil(event)" id="toggle-auth-profil">Hesabın yok mu? Kayıt Ol</a>
        </div>
    </div>

    <script>
        let profAktifKullanici = JSON.parse(localStorage.getItem('user'));
        let isLoginMode = true;
        const API_BASE = "";

        initPage();

        function initPage() {
            profAktifKullanici = JSON.parse(localStorage.getItem('user'));
            if (!profAktifKullanici) {
                document.getElementById('profile-container').style.display = 'none';
                document.getElementById('login-container').style.display = 'block';
            } else {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('profile-container').style.display = 'block';
                
                const name = profAktifKullanici.username || 'Kullanıcı';
                document.getElementById('prof-name').innerText = name;
                document.getElementById('avatar-emoji').innerText = name.charAt(0).toUpperCase();
                premiumKontrol();
            }
        }

        function toggleAuthProfil(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Giriş Yap" : "Kayıt Ol";
            document.getElementById('auth-submit-profil').innerText = isLoginMode ? "GİRİŞ YAP" : "KAYIT OL";
            document.getElementById('toggle-auth-profil').innerText = isLoginMode ? "Hesabın yok mu? Kayıt Ol" : "Zaten hesabın var mı? Giriş Yap";
            document.getElementById('auth-pass-group-profil').style.display = isLoginMode ? 'block' : 'none';
        }

        document.getElementById('auth-form-profil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('auth-user-profil').value.trim();
            let password = document.getElementById('auth-pass-profil').value;
            if (!isLoginMode && !password) password = "none";
            if (!username) return;

            try {
                const res = await fetch(`${API_BASE}${isLoginMode ? '/login' : '/register'}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    initPage();
                } else {
                    alert(data.message || "Hata oluştu.");
                }
            } catch {
                const fakeUser = { id: Date.now().toString(), username, password };
                localStorage.setItem('user', JSON.stringify(fakeUser));
                initPage();
            }
        });

        async function premiumKontrol() {
            try {
                const res = await fetch(`${API_BASE}/api/verify-premium/${profAktifKullanici.id}`).catch(() => null);
                if (res && res.ok) {
                    const data = await res.json();
                    if (data.status === "premium") {
                        document.getElementById('prof-badge').innerText = '👑 Premium Üye';
                        document.getElementById('prof-badge').classList.add('premium');
                        document.getElementById('key-section').style.display = 'none';
                    }
                }
            } catch {}
        }

        async function keyAktifEtProfil() {
            const key = document.getElementById('premium-key').value.trim();
            const msg = document.getElementById('key-msg');
            msg.style.display = 'block';
            msg.style.color = '#94a3b8';
            msg.innerText = "Kontrol ediliyor...";

            try {
                const res = await fetch(`${API_BASE}/api/activate-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, userId: profAktifKullanici.id })
                });
                const data = await res.json();
                if (data.success) {
                    msg.style.color = '#4ade80';
                    msg.innerText = "Premium aktif edildi! 👑";
                    premiumKontrol();
                } else {
                    msg.style.color = '#ef4444';
                    msg.innerText = data.message || "Geçersiz key!";
                }
            } catch {
                if (key.length > 5) {
                    msg.style.color = '#4ade80';
                    msg.innerText = "Simülasyon: Premium aktif edildi! 👑";
                    document.getElementById('prof-badge').innerText = '👑 Premium Üye';
                    document.getElementById('prof-badge').classList.add('premium');
                    document.getElementById('key-section').style.display = 'none';
                } else {
                    msg.style.color = '#ef4444';
                    msg.innerText = "Geçersiz key veya sunucuya bağlanılamadı.";
                }
            }
        }

        document.getElementById('profile-pass-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const newPass = document.getElementById('prof-new-password').value;
            profAktifKullanici.password = newPass;
            localStorage.setItem('user', JSON.stringify(profAktifKullanici));

            const msg = document.getElementById('prof-pass-msg');
            msg.innerText = "Şifre güncellendi ✅";
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; document.getElementById('prof-new-password').value = ''; }, 2500);
        });

        function cikisYapProfil() {
            localStorage.removeItem('user');
            initPage();
        }
    </script>
</body>
</html>

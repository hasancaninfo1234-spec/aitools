<!-- Bu dosya, kullanıcı giriş ekranını sağlama işini yapar. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | AI Tools</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Giriş sayfasına özel stil düzenlemeleri */
        body {
            background: #0a0b14;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .login-box {
            width: 90vw;
            max-width: 400px;
            padding: 40px;
            background: #161926;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        @media (max-width: 480px) {
            body { padding: 15px; box-sizing: border-box; }
            .login-box { padding: 25px 20px; }
        }

        .login-box h2 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: #fff;
        }

        .login-box p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0a0b14;
            border: 1px solid #2d3142;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: #38bdf8;
            color: #000;
            border: none;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #64748b;
        }

        .footer-links a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔑 Giriş Yap</h2>
        <p>Yapay zeka evrenine tekrar hoş geldin.</p>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="Kullanıcı adını gir" required>
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">OTURUM AÇ</button>
        </form>

        <div class="footer-links">
            Hesabın yok mu? <a href="register.html">Hemen Kayıt Ol</a>
        </div>

        <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                let res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                }).catch(() => null);

                if (res && res.ok) {
                    const data = await res.json();
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast("Giriş başarılı! Yönlendiriliyorsunuz...", "success");
                    setTimeout(() => { window.location.href = 'index.html'; }, 800);
                } else {
                    showToast("Kullanıcı adı veya şifre hatalı! Lütfen tekrar deneyiniz.", "error");
                }
            } catch (err) {
                console.error("Giriş hatası:", err);
                showToast("Sunucuya bağlanılamadı.", "warning");
            }
        };
    </script>
</body>
</html>

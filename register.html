<!-- Bu dosya, kullanıcı kayıt ekranını sağlama işini yapar. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol | AI Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#0a0b14; color:white; display:flex; justify-content:center; align-items:center; height:100vh;">
    <div style="background:#161926; padding:40px; border-radius:15px; width:300px; text-align:center;">
        <h2>Kayıt Ol</h2>
        <form id="register-form">
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı" required style="width:100%; margin:10px 0; padding:10px;"><br>
            <input type="password" id="reg-password" placeholder="Şifre" required style="width:100%; margin:10px 0; padding:10px;"><br>
            <button type="submit" style="width:100%; padding:10px; background:#38bdf8; border:none; font-weight:bold; cursor:pointer;">Kayıt Ol</button>
        </form>
        <p style="margin-top:15px;">
            Zaten hesabın var mı? <a href="login.html" style="color:#38bdf8;">Giriş Yap</a>
        </p>
    </div>

    <script>
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;

            try {
                let res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                }).catch(() => null);

                if (!res || !res.ok) {
                    res = await fetch('http://localhost:3000/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    }).catch(() => null);
                }

                if (res && res.ok) {
                    alert("Kayıt başarılı! Şimdi giriş yapabilirsin.");
                    window.location.href = 'login.html';
                } else {
                    const data = res ? await res.json() : {};
                    alert(data.message || "Kayıt sırasında hata oluştu!");
                }
            } catch(err) {
                alert("Sunucuya bağlanılamadı.");
            }
        };
    </script>
</body>
</html>

<!-- Bu dosya, yeni kullanıcı kayıt ekranını oluşturma işini yapar. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol | AI Tools</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box { max-width: 400px; margin: 100px auto; padding: 40px; background: #161926; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0a0b14; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .reg-btn { width: 100%; padding: 15px; background: #10b981; color: white; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body style="background: #0a0b14; color: white;">
    <div class="login-box">
        <h2>📝 Yeni Hesap Oluştur</h2>
        <form id="register-form">
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı Belirle" required>
            <input type="password" id="reg-password" placeholder="Güçlü Bir Şifre Gir" required>
            <button type="submit" class="reg-btn">Kayıt İşlemini Tamamla</button>
        </form>
        <p style="margin-top:20px; font-size:0.85rem; color:#64748b;">
            Zaten üye misin? <a href="login.html" style="color:#38bdf8; text-decoration:none;">Giriş Yap</a>
        </p>
    </div>

    <script>
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;

            const res = await fetch('http://localhost:3000/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                alert("Kayıt başarılı! Şimdi giriş yapabilirsin.");
                window.location.href = 'login.html';
            } else {
                const data = await res.json();
                alert(data.message || "Kayıt sırasında hata oluştu!");
            }
        };
    </script>
</body>
</html>

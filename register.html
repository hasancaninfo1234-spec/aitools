<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | AI Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #0a0b14;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .reg-box {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: #161926;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .reg-box h2 {
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #38bdf8;
        }

        .reg-input {
            width: 100%;
            padding: 14px;
            background: #0a0b14;
            border: 1px solid #2d3142;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .reg-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .reg-btn {
            width: 100%;
            padding: 14px;
            background: #38bdf8;
            color: #000;
            border: none;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .reg-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .reg-box { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="reg-box">
        <h2>✨ Kayıt Ol</h2>
        <form id="register-form">
            <input type="text" id="reg-username" class="reg-input" placeholder="Kullanıcı Adı" required autocomplete="off">
            <input type="password" id="reg-password" class="reg-input" placeholder="Şifre" required>
            <button type="submit" class="reg-btn">KAYIT OL</button>
        </form>
        <p style="margin-top:20px; font-size: 0.9rem; color: #94a3b8;">
            Zaten hesabın var mı? <a href="login.html" style="color:#38bdf8; font-weight:600; text-decoration:none;">Giriş Yap</a>
        </p>
        <div style="margin-top: 15px;">
            <a href="index.html" style="color: #64748b; font-size: 0.8rem; text-decoration: none;">← Ana Sayfaya Dön</a>
        </div>
    </div>

    <script>
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;

            try {
                let res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                }).catch(() => null);

                if (!res || !res.ok) {
                    res = await fetch('http://localhost:3000/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    }).catch(() => null);
                }

                if (res && res.ok) {
                    alert("Kayıt başarılı! Şimdi giriş yapabilirsin.");
                    window.location.href = 'login.html';
                } else {
                    const data = res ? await res.json() : {};
                    alert(data.message || "Kayıt sırasında hata oluştu!");
                }
            } catch(err) {
                alert("Sunucuya bağlanılamadı.");
            }
        };
    </script>
</body>
</html>

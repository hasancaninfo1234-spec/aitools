<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelen Kutusu & Bildirimlerim | AI Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0b14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .bg-glow-top {
            position: fixed; top: -150px; left: 50%; transform: translateX(-50%);
            width: 700px; height: 400px;
            background: radial-gradient(ellipse, rgba(192, 132, 252, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .back-btn {
            position: fixed; top: 25px; left: 35px;
            color: #38bdf8; text-decoration: none; font-weight: 600;
            font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
            background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 8px 16px; border-radius: 12px;
            backdrop-filter: blur(10px); transition: all 0.2s ease;
            z-index: 10;
        }
        .back-btn:hover { background: rgba(56, 189, 248, 0.18); transform: translateX(-2px); }

        .inbox-card {
            width: 100%; max-width: 680px;
            background: rgba(16, 19, 32, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px;
            backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative; z-index: 1;
        }

        .inbox-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap; gap: 10px;
        }
        .inbox-title {
            font-size: 1.4rem; font-weight: 800; color: #c084fc;
            display: flex; align-items: center; gap: 10px;
        }

        .filter-tabs {
            display: flex; gap: 8px; margin-bottom: 20px;
        }
        .filter-tab-btn {
            background: rgba(255, 255, 255, 0.03); color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.82rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-tab-btn.active {
            background: rgba(192, 132, 252, 0.15); color: #c084fc;
            border-color: rgba(192, 132, 252, 0.4);
        }

        .notification-list {
            display: flex; flex-direction: column; gap: 12px;
            max-height: 440px; overflow-y: auto; padding-right: 4px;
        }
        .notification-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px; padding: 18px;
            transition: all 0.2s ease; position: relative;
        }
        .notification-item.unread {
            background: rgba(192, 132, 252, 0.06);
            border-color: rgba(192, 132, 252, 0.3);
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.05);
        }
        .notification-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px;
        }
        .notification-title {
            font-size: 0.95rem; font-weight: 700; color: #ffffff;
            display: flex; align-items: center; gap: 8px;
        }
        .notification-date {
            font-size: 0.75rem; color: #64748b; font-weight: 600;
        }
        .notification-body {
            font-size: 0.88rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 8px;
        }
        .admin-note-box {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid #38bdf8;
            padding: 8px 12px; border-radius: 0 8px 8px 0;
            font-size: 0.83rem; color: #e0f2fe; margin-top: 8px;
        }

        .btn-action-sm {
            background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38bdf8; font-weight: 600; border-radius: 8px;
            padding: 6px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-action-sm:hover { background: rgba(56, 189, 248, 0.2); }

        .btn-delete-sm {
            background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444; font-weight: 600; border-radius: 8px;
            padding: 6px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-delete-sm:hover { background: rgba(239, 68, 68, 0.18); }

        .empty-state {
            text-align: center; padding: 40px 20px; color: #64748b;
        }
        .empty-state-icon { font-size: 2.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="bg-glow-top"></div>
    <a href="index.html" class="back-btn">← Ana Sayfaya Dön</a>

    <div class="inbox-card">
        <div class="inbox-header">
            <div class="inbox-title">
                <span>📥 Gelen Kutusu & Bildirimlerim</span>
            </div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <a href="tickets.html" class="btn-action-sm" style="text-decoration:none; display:inline-flex; align-items:center; gap:4px; background:rgba(56,189,248,0.15); color:#38bdf8; border-color:rgba(56,189,248,0.3);">🎫 Destek Taleplerim ↗</a>
                <button onclick="markAllAsRead()" class="btn-action-sm">Tümünü Okundu İşaretle</button>
                <button onclick="clearAllNotifs()" class="btn-delete-sm">Tümünü Sil</button>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab-btn active" onclick="setFilter('all', this)">Tüm Bildirimler</button>
            <button class="filter-tab-btn" onclick="setFilter('unread', this)">Okunmamış</button>
            <button class="filter-tab-btn" onclick="setFilter('admin', this)">Yönetici Mesajları</button>
        </div>

        <div class="notification-list" id="notifications-container">
            <!-- Bildirimler JS ile yüklenecek -->
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let currentUser = null;

        initInbox();

        function initInbox() {
            try {
                currentUser = JSON.parse(localStorage.getItem('user'));
            } catch(e) { currentUser = null; }

            renderNotifications();
        }

        function getUserNotifs() {
            const all = JSON.parse(localStorage.getItem('userNotifications') || '[]');
            if (!currentUser) return all.filter(n => n.targetUser === 'all');
            
            return all.filter(n => 
                n.targetUser === 'all' || 
                n.targetUser === currentUser.username || 
                (currentUser.email && n.targetUser.toLowerCase() === currentUser.email.toLowerCase())
            );
        }

        function setFilter(filter, btnEl) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab-btn').forEach(b => b.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            renderNotifications();
        }

        function renderNotifications() {
            const container = document.getElementById('notifications-container');
            let notifs = getUserNotifs();

            if (currentFilter === 'unread') {
                notifs = notifs.filter(n => !n.isRead);
            } else if (currentFilter === 'admin') {
                notifs = notifs.filter(n => n.adminNote || n.type === 'dev_approved' || n.type === 'dev_rejected' || n.type === 'tool_approved' || n.type === 'tool_rejected');
            }

            if (notifs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p style="font-weight:600; font-size:0.95rem;">Gelen kutunuzda henüz bir bildirim yok.</p>
                        <p style="font-size:0.82rem; margin-top:4px;">Yönetici onayları ve sistem duyuruları burada görünecektir.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = notifs.map(n => `
                <div class="notification-item ${n.isRead ? '' : 'unread'}">
                    <div class="notification-top">
                        <div class="notification-title">
                            <span>${n.icon || '🔔'}</span>
                            <span>${n.title}</span>
                        </div>
                        <span class="notification-date">${n.date}</span>
                    </div>
                    <div class="notification-body">${n.message}</div>
                    ${n.adminNote ? `<div class="admin-note-box">💬 <strong>Yönetici Notu:</strong> ${n.adminNote}</div>` : ''}
                </div>
            `).join('');
        }

        function markAllAsRead() {
            let all = JSON.parse(localStorage.getItem('userNotifications') || '[]');
            if (currentUser) {
                all = all.map(n => {
                    if (n.targetUser === 'all' || n.targetUser === currentUser.username || (currentUser.email && n.targetUser === currentUser.email)) {
                        return { ...n, isRead: true };
                    }
                    return n;
                });
                localStorage.setItem('userNotifications', JSON.stringify(all));
            }
            renderNotifications();
        }

        function clearAllNotifs() {
            if(!confirm("Tüm bildirimlerinizi silmek istediğinize emin misiniz?")) return;
            let all = JSON.parse(localStorage.getItem('userNotifications') || '[]');
            if (currentUser) {
                all = all.filter(n => 
                    n.targetUser !== 'all' && 
                    n.targetUser !== currentUser.username && 
                    (!currentUser.email || n.targetUser !== currentUser.email)
                );
                localStorage.setItem('userNotifications', JSON.stringify(all));
            }
            renderNotifications();
        }
    </script>
</body>
</html>
